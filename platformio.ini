[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
build_src_filter =
    +<Core/**>
    +<USB_DEVICE/**>
    +<Middlewares/**>
    -<EWARM>
    -<Drivers/**>
    -<Middlewares/ST/STM32_USB_Device_Library/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/ARMCLANG/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/CCS/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/CodeWarrior/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ATMega323/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ATMega128/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ATMega323/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ATMega323_WinAVR/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CA9/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CRx_MPU/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM33/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM35P/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM85/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM85_NTZ/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM85_TFM/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM85_TFM_NTZ/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/IAR/**>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_1.c>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_2.c>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_3.c>
    -<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_5.c>
build_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -I src/Core
    -I src/Core/Inc
    -I src/USB_DEVICE/App
    -I src/USB_DEVICE/Target
    -I src/Middlewares/Third_Party/FreeRTOS/Source/include
    -I src/Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -I src/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
